global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'anhtuan-auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['anhtuan-auth-service:8000']
        labels:
          application: 'Auth Service Application'

  - job_name: 'gateway-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['anhtuan-gateway-service:8080']
        labels:
          application: 'Gateway Service Application'

  - job_name: 'order-service'
    metrics_path: /order/actuator/prometheus
    static_configs:
      - targets: ['anhtuan-order-service:8020']
        labels:
          application: 'Order Service Application'

  - job_name: 'product-service'
    metrics_path: /product/actuator/prometheus
    static_configs:
      - targets: ['anhtuan-product-service:8010']
        labels:
          application: 'Product Service Application'

  - job_name: 'query-service'
    metrics_path: /query/actuator/prometheus
    static_configs:
      - targets: ['anhtuan-query-service:8030']
        labels:
          application: 'Query Service Application'
